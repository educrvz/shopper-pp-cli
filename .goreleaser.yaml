version: 2
project_name: shopper-pp-cli
changelog:
  disable: true
builds:
  - id: shopper-pp-cli
    main: ./cmd/shopper-pp-cli
    binary: shopper-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/educrvz/shopper-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: shopper-pp-mcp
    main: ./cmd/shopper-pp-mcp
    binary: shopper-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: shopper-pp-cli
    repository:
      owner: educrvz
      name: homebrew-tap
    homepage: "https://github.com/educrvz/shopper-pp-cli"
    description: "The first CLI for Shopper — every catalog, cart"
    binaries:
      - shopper-pp-cli
      - shopper-pp-mcp
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/shopper-pp-cli"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/shopper-pp-mcp"]
          end
nfpms:
  - id: shopper-pp-cli
    package_name: shopper-pp-cli
    vendor: educrvz
    homepage: "https://github.com/educrvz/shopper-pp-cli"
    maintainer: "educrvz <eduardo.domc.bot@gmail.com>"
    description: "The first CLI for Shopper — every catalog, cart, and delivery surface plus a local price/basket history the web app discards each cycle."
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
scoops:
  - repository:
      owner: educrvz
      name: scoop-bucket
    directory: bucket
    homepage: "https://github.com/educrvz/shopper-pp-cli"
    description: "The first CLI for Shopper — every catalog, cart, and delivery surface plus a local price/basket history the web app discards each cycle."
    license: Apache-2.0
